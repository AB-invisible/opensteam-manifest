# Render Blueprint — manifest web + bot (S3 storage, Neon Postgres)
# Repo: https://github.com/AB-invisible/opensteam-manifest
# Note: Render free tier allows one Postgres — use Neon DATABASE_URL via setup-render.js

services:  - type: web
    name: manifest-web
    runtime: docker
    plan: free
    repo: https://github.com/AB-invisible/opensteam-manifest
    branch: main
    dockerfilePath: ./Dockerfile
    dockerCommand: node scripts/start-render-web.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKIP_ENSURE_BOT
        value: "1"
      - key: SKIP_HOSTED_BOTS
        value: "1"
      - key: BUCKET_TYPE
        value: s3
      - key: STORAGE_PATH
        value: /tmp/data
      - key: STORAGE_SYNC_ON_START
        value: "0"
      - key: USER_EMAILS_ENABLED
        value: "false"
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_ENDPOINT_URL
        sync: false
      - key: AWS_S3_BUCKET_NAME
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: INTERNAL_SERVICE_SECRET
        sync: false
      - key: WHOP_API_KEY
        sync: false
      - key: WHOP_WEBHOOK_SECRET
        sync: false

  - type: web
    name: manifest-bot
    runtime: docker
    plan: free
    repo: https://github.com/AB-invisible/opensteam-manifest
    branch: main
    dockerfilePath: ./Dockerfile
    dockerCommand: node scripts/start-render-bot.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: BUCKET_TYPE
        value: s3
      - key: STORAGE_PATH
        value: /tmp/data
      - key: STORAGE_SYNC_ON_START
        value: "0"
      - key: USER_EMAILS_ENABLED
        value: "false"
      - key: KEEPALIVE_CHANNEL_ID
        value: "1533279676037075005"
      - key: KEEPALIVE_USERNAME
        value: itz.seasonn
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: INTERNAL_APP_URL
        sync: false
      - key: MANIFEST_UPLOAD_BASE_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_ENDPOINT_URL
        sync: false
      - key: AWS_S3_BUCKET_NAME
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RYUU_API_KEY
        sync: false
      - key: MORRENUS_API_KEY
        sync: false
      - key: INTERNAL_SERVICE_SECRET
        sync: false
